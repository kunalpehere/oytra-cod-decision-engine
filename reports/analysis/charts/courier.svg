<svg xmlns="http://www.w3.org/2000/svg" width="960" height="415" viewBox="0 0 960 415" role="img">
<title>Courier and RTO - development orders</title>
<rect width="100%" height="100%" fill="#fff"/>
<g font-family="Arial,sans-serif" fill="#172b4d">
<text x="24" y="35" font-size="22">Courier and RTO - development orders</text>
<text x="24" y="61" font-size="13">Observed RTO rates; whiskers: approximate 95% Wilson intervals. Descriptive, not causal.</text>
